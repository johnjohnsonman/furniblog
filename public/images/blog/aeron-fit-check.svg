<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"><rect width="960" height="640" fill="#f5f2eb"/><g font-family="Arial,sans-serif"><text x="40" y="45" font-size="16" fill="#203c40">FURNIBLOG / BUYING FIELD NOTES</text><text x="40" y="99" font-size="38" fill="#203c40">Fit the chair to your workspace</text><text x="40" y="139" font-size="22" fill="#59706e">Use your working position, not a generic height label.</text><defs><marker id="a" markerWidth="7" markerHeight="7" refX="3" refY="3" orient="auto-start-reverse"><path d="M6 0L0 3L6 6" fill="none" stroke="#c0613f"/></marker></defs><rect x="40" y="175" width="420" height="385" rx="16" fill="white" stroke="#bac8c6"/><path d="M85 520H425M140 475H285M215 475V380M128 262L142 372Q145 388 164 389H281M268 302H354V320M363 274H429V479" fill="none" stroke="#203c40" stroke-width="13" stroke-linecap="round"/><circle cx="205" cy="240" r="24" fill="#bbd8d0"/><path d="M199 274L214 347H307L321 510H353M216 300L281 318H335" fill="none" stroke="#6c9e91" stroke-width="20" stroke-linecap="round"/><path d="M101 398L101 505" stroke="#c0613f" stroke-width="4" marker-start="url(#a)" marker-end="url(#a)"/><path d="M287 369L312 369" stroke="#c0613f" stroke-width="4" marker-start="url(#a)" marker-end="url(#a)"/><path d="M385 283L385 301" stroke="#c0613f" stroke-width="4" marker-start="url(#a)" marker-end="url(#a)"/><text x="76" y="454" font-size="24" fill="#203c40">1</text><text x="283" y="413" font-size="24" fill="#203c40">2</text><text x="398" y="330" font-size="24" fill="#203c40">3</text><text x="495" y="223" font-size="25" fill="#203c40">1  Seat to floor</text><text x="495" y="257" font-size="25" fill="#203c40">Record your working height.</text><text x="495" y="291" font-size="25" fill="#203c40">Support your feet.</text><text x="495" y="340" font-size="25" fill="#203c40">2  Front edge</text><text x="495" y="374" font-size="25" fill="#203c40">Sit back and check leg space.</text><text x="495" y="408" font-size="25" fill="#203c40">Overall depth is not seat depth.</text><text x="495" y="457" font-size="25" fill="#203c40">3  Arms to desk</text><text x="495" y="491" font-size="25" fill="#203c40">Measure below the apron.</text><text x="495" y="525" font-size="25" fill="#203c40">Check width as well as height.</text><text x="40" y="602" font-size="19" fill="#59706e">Editorial schematic • not to scale • configuration must be verified</text></g></svg>