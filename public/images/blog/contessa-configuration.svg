<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"><rect width="960" height="640" fill="#f5f2eb"/><g font-family="Arial,sans-serif"><text x="40" y="45" font-size="16" fill="#203c40">FURNIBLOG / BUYING FIELD NOTES</text><text x="40" y="99" font-size="38" fill="#203c40">Contessa II: specify the options</text><text x="40" y="139" font-size="22" fill="#59706e">A family name does not describe the whole chair.</text><rect x="40" y="180" width="425" height="167" rx="16" fill="white" stroke="#bac8c6"/><rect x="495" y="180" width="425" height="167" rx="16" fill="white" stroke="#bac8c6"/><rect x="40" y="370" width="425" height="167" rx="16" fill="white" stroke="#bac8c6"/><rect x="495" y="370" width="425" height="167" rx="16" fill="white" stroke="#bac8c6"/><text x="65" y="226" font-size="25" fill="#203c40">01  SEAT</text><text x="65" y="260" font-size="25" fill="#203c40">Match the material and</text><text x="65" y="294" font-size="25" fill="#203c40">usable depth.</text><text x="520" y="226" font-size="25" fill="#203c40">02  HEADREST</text><text x="520" y="260" font-size="25" fill="#203c40">Fixed and adjustable</text><text x="520" y="294" font-size="25" fill="#203c40">are different options.</text><text x="65" y="416" font-size="25" fill="#203c40">03  ARMS</text><text x="65" y="450" font-size="25" fill="#203c40">Check the installed arms</text><text x="65" y="484" font-size="25" fill="#203c40">and working levers.</text><text x="520" y="416" font-size="25" fill="#203c40">04  MODEL</text><text x="520" y="450" font-size="25" fill="#203c40">Read the label and confirm</text><text x="520" y="484" font-size="25" fill="#203c40">regional specifications.</text><text x="40" y="602" font-size="19" fill="#59706e">Editorial schematic • not to scale • configuration must be verified</text></g></svg>