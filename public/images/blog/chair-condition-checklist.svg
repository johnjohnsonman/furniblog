<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860"><rect width="1200" height="860" fill="#f8f5ef"/><g font-family="Arial,sans-serif" fill="#202c30"><text x="54" y="58" font-size="17" letter-spacing="3">FURNIBLOG / BEFORE YOU BUY</text><text x="54" y="118" font-size="43" font-weight="bold">Ask for the work behind the label.</text><rect x="54" y="166" width="1092" height="124" rx="14" fill="#e5edf1"/><circle cx="109" cy="228" r="29" fill="#263b40"/><text x="101" y="236" font-size="25" fill="white">1</text><text x="164" y="209" font-size="20" font-weight="bold" letter-spacing="2">PARTS</text><text x="164" y="249" font-size="28">Which parts were replaced? OEM or aftermarket?</text><rect x="54" y="312" width="1092" height="124" rx="14" fill="#e9e5dd"/><circle cx="109" cy="374" r="29" fill="#263b40"/><text x="101" y="382" font-size="25" fill="white">2</text><text x="164" y="355" font-size="20" font-weight="bold" letter-spacing="2">AGE</text><text x="164" y="395" font-size="28">Request a photo of the production label.</text><rect x="54" y="458" width="1092" height="124" rx="14" fill="#e5ece1"/><circle cx="109" cy="520" r="29" fill="#263b40"/><text x="101" y="528" font-size="25" fill="white">3</text><text x="164" y="501" font-size="20" font-weight="bold" letter-spacing="2">CONDITION</text><text x="164" y="541" font-size="28">Ask for photos of wear, repairs and missing parts.</text><rect x="54" y="604" width="1092" height="124" rx="14" fill="#eee4d9"/><circle cx="109" cy="666" r="29" fill="#263b40"/><text x="101" y="674" font-size="25" fill="white">4</text><text x="164" y="647" font-size="20" font-weight="bold" letter-spacing="2">COVERAGE</text><text x="164" y="687" font-size="28">Get the warranty and return terms in writing.</text><text x="54" y="814" font-size="20">Compare the documented condition and seller terms, not just the model name.</text></g></svg>