<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#f8f5ef"/><g font-family="Arial,sans-serif" fill="#202c30"><text x="54" y="58" font-size="17" letter-spacing="3">FURNIBLOG / BUYING GUIDE</text><text x="54" y="116" font-size="43" font-weight="bold">Four labels. Different questions.</text><text x="54" y="154" font-size="21">A listing label is a starting point. Verify the work and terms with the seller.</text><g transform="translate(54 192)"><rect width="534" height="281" rx="18" fill="#e9e5dd"/><text x="24" y="42" font-size="29" font-weight="bold">Used / as-is</text><g transform="translate(28 68) scale(.78)" color="#46565a"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="35" y="8" width="75" height="100" rx="19"/><path d="M40 112h92q12 0 12 12v6H42q-13 0-13-12V95M29 81H9m113 0h24M87 132v39m-46 17 46-17 46 17m-46-17v26"/><circle cx="39" cy="193" r="6"/><circle cx="136" cy="193" r="6"/><circle cx="87" cy="202" r="6"/></g></g><text x="186" y="92" font-size="18" font-weight="bold">Start with the actual condition</text><text x="186" y="133" font-size="18">Ask for close-up photos.</text><text x="186" y="165" font-size="18">Test every adjustment.</text></g><g transform="translate(612 192)"><rect width="534" height="281" rx="18" fill="#e5edf1"/><text x="24" y="42" font-size="29" font-weight="bold">Open-box</text><g transform="translate(28 68) scale(.78)" color="#46565a"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="35" y="8" width="75" height="100" rx="19"/><path d="M40 112h92q12 0 12 12v6H42q-13 0-13-12V95M29 81H9m113 0h24M87 132v39m-46 17 46-17 46 17m-46-17v26"/><circle cx="39" cy="193" r="6"/><circle cx="136" cy="193" r="6"/><circle cx="87" cy="202" r="6"/></g></g><text x="186" y="92" font-size="18" font-weight="bold">A return or display item</text><text x="186" y="133" font-size="18">Check signs of handling.</text><text x="186" y="165" font-size="18">Ask about previous assembly.</text></g><g transform="translate(54 499)"><rect width="534" height="281" rx="18" fill="#e5ece1"/><text x="24" y="42" font-size="29" font-weight="bold">Refurbished</text><g transform="translate(28 68) scale(.78)" color="#46565a"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="35" y="8" width="75" height="100" rx="19"/><path d="M40 112h92q12 0 12 12v6H42q-13 0-13-12V95M29 81H9m113 0h24M87 132v39m-46 17 46-17 46 17m-46-17v26"/><circle cx="39" cy="193" r="6"/><circle cx="136" cy="193" r="6"/><circle cx="87" cy="202" r="6"/></g></g><text x="186" y="92" font-size="18" font-weight="bold">Work varies by seller</text><text x="186" y="133" font-size="18">Get the inspection checklist.</text><text x="186" y="165" font-size="18">Ask which parts were replaced.</text></g><g transform="translate(612 499)"><rect width="534" height="281" rx="18" fill="#eee4d9"/><text x="24" y="42" font-size="29" font-weight="bold">Remanufactured</text><g transform="translate(28 68) scale(.78)" color="#46565a"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="35" y="8" width="75" height="100" rx="19"/><path d="M40 112h92q12 0 12 12v6H42q-13 0-13-12V95M29 81H9m113 0h24M87 132v39m-46 17 46-17 46 17m-46-17v26"/><circle cx="39" cy="193" r="6"/><circle cx="136" cy="193" r="6"/><circle cx="87" cy="202" r="6"/></g></g><text x="186" y="92" font-size="18" font-weight="bold">A rebuild process to verify</text><text x="186" y="133" font-size="18">Request the rebuild scope.</text><text x="186" y="165" font-size="18">Confirm parts and written coverage.</text></g><text x="54" y="850" font-size="20">The same chair can carry any label. Appearance alone does not establish its condition.</text></g></svg>