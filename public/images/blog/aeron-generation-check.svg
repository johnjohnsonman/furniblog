<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"><rect width="960" height="640" fill="#f5f2eb"/><g font-family="Arial,sans-serif"><text x="40" y="45" font-size="16" fill="#203c40">FURNIBLOG / BUYING FIELD NOTES</text><text x="40" y="99" font-size="38" fill="#203c40">Aeron: identify before pricing</text><text x="40" y="139" font-size="22" fill="#59706e">Use the actual label and mechanism together.</text><rect x="40" y="180" width="425" height="230" rx="16" fill="white" stroke="#bac8c6"/><rect x="495" y="180" width="425" height="230" rx="16" fill="white" stroke="#bac8c6"/><text x="65" y="225" font-size="25" fill="#203c40">CLASSIC</text><text x="520" y="225" font-size="25" fill="#203c40">REMASTERED</text><path d="M100 270H390M140 283L180 346M285 283L325 346" stroke="#203c40" stroke-width="15" stroke-linecap="round"/><path d="M555 270H845M688 283L728 346" stroke="#203c40" stroke-width="15" stroke-linecap="round"/><text x="65" y="384" font-size="25" fill="#203c40">Two swing arms</text><text x="520" y="384" font-size="25" fill="#203c40">One slimmer swing arm</text><rect x="40" y="435" width="880" height="124" rx="16" fill="white" stroke="#bac8c6"/><text x="65" y="476" font-size="26" fill="#203c40">A lumbar pad alone does not identify the generation.</text><text x="65" y="510" font-size="26" fill="#203c40">Confirm size, fitted support, options and replacement parts.</text><text x="40" y="602" font-size="19" fill="#59706e">Editorial schematic • not to scale • configuration must be verified</text></g></svg>